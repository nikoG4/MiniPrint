name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/MiniPrint.Protocol.Tests/MiniPrint.Protocol.Tests.csproj --configuration Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MiniPrint.sln
      - run: dotnet test MiniPrint.sln --configuration Release --no-restore
      - run: dotnet publish src/MiniPrint.Server/MiniPrint.Server.csproj --configuration Release --runtime win-x64 --self-contained true
